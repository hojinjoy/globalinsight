[project]
name = "globalinsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# The project root isn't installed as a package (no [build-system]/wheel
# config), so "globalinsight" is only importable when the root is on
# sys.path. `pythonpath` makes `uv run pytest` work the same as
# `uv run python -m pytest`.
pythonpath = ["."]
